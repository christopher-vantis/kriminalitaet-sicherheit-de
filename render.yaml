# Render-Konfiguration: statische Website, kein Server nötig.
# Render liest diese Datei beim Verbinden des Repositorys automatisch.
#
# Wichtig: KEINE Umleitungsregel auf index.html. Die Seiten sind einzeln
# verlinkt (index.html -> deutschland_app.html usw.); eine Regel "/* ->
# /index.html" würde diese Dateien überschreiben.
services:
  - type: web
    name: kriminalitaet-sicherheit-de
    runtime: static
    staticPublishPath: dashboard
    buildCommand: ""
    headers:
      # Die Seiten sind eigenständige Einzeldateien; kurze Haltbarkeit, damit
      # Aktualisierungen sofort ankommen.
      - path: /*
        name: Cache-Control
        value: public, max-age=300
